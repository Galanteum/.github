# =============================================================================
# Dependency-Track — IaC-focused SBOM Upload (reusable workflow)
# =============================================================================
# WHAT: For Terraform / Ansible / Kubernetes-manifest / Helm repos.
#       Layers on top of dt-sbom-app.yml with IaC-specific scanners:
#         * cdxgen        — provider/module deps from .terraform.lock.hcl
#         * trivy config  — Terraform/Kubernetes misconfig detection
#         * checkov       — deeper IaC policy violation scanner
#         * tfsec         — Terraform-specific security scanner
#
# WHO: Any Techsecom/* or Galanteum/* repo whose primary content is IaC.
#
# AUTH: Same OIDC → Vault → dt-sbom-uploader-read pattern as the app workflow.
#
# HOW TO CALL from a consuming repo (.github/workflows/sbom.yml):
#   name: SBOM (IaC)
#   on:
#     push:
#       branches: [main]
#     pull_request:
#     schedule:
#       - cron: '0 3 * * 2'   # weekly Tuesday 03:00 UTC
#   permissions:
#     id-token: write
#     contents: read
#     security-events: write
#   jobs:
#     sbom:
#       uses: Galanteum/.github/.github/workflows/dt-sbom-iac.yml@main
#       with:
#         project-name: my-iac-repo
# =============================================================================
name: DT SBOM Upload — IaC (cdxgen + checkov + tfsec + trivy config)

on:
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      project-version:
        required: false
        type: string
        default: ""
      parent-project:
        required: false
        type: string
        default: ""
      fail-on-critical:
        required: false
        type: boolean
        default: false
      fail-on-iac-high:
        description: Fail if checkov/tfsec/trivy-config report HIGH severity misconfig
        required: false
        type: boolean
        default: false
      scan-path:
        description: Root path to scan (default . — override if repo has subdir focus)
        required: false
        type: string
        default: "."
      runner:
        # NOTE: neither the description string NOR the comment above it may
        # contain a literal dollar-double-brace expression referencing
        # `inputs.*` — GitHub Actions evaluates expressions in workflow YAML
        # anywhere they appear, and `inputs.*` is not in scope while the
        # inputs block itself is being parsed. Prior version failed to load
        # with "Unrecognized named-value: 'inputs'" because the example in
        # the description resolved against an uninitialised inputs table.
        description: |
          Runner label. Defaults to the org's self-hosted ARC scaleset 'techsecom-k8s-runners'
          historical behavior. Override to a self-hosted label (e.g. a
          ScaleSet name like 'gitops-k8s-runners') when the calling org has
          lost or disabled access to GitHub-hosted runners — billing block,
          egress policy, air-gapped environment. Named `runner` (single word)
          rather than `runs-on` because the expression parser treats `-`
          inside identifiers as subtraction, so `inputs.runs-on` would be
          evaluated as `inputs.runs` minus `on` and error out.
        required: false
        type: string
        default: "techsecom-k8s-runners"

env:
  VAULT_ADDR: https://vault.mgmt.techsecom.io
  DT_URL: https://dtrack.ops.techsecom.io

jobs:
  sbom:
    runs-on: ${{ inputs.runner }}
    permissions:
      id-token: write
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Compute project version
        id: ver
        shell: bash
        run: |
          if [[ -n "${{ inputs.project-version }}" ]]; then
            V="${{ inputs.project-version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME}"
          else
            # Branch pushes use the BRANCH NAME (stable), NOT <branch>-<sha>.
            # A per-commit version minted a new DT project on every commit with no
            # cleanup -> unbounded version sprawl (2,773 projects; gitops-argocd
            # alone reached 1,110 from image-updater bot commits) -> DEPENDENCY-
            # METRICS recalculation churn -> cnpg-cluster-w XID burn + dt-scan-
            # exporter CPU throttling. One project per branch, updated in place,
            # reflects the branch's CURRENT state (the sha lives in git + the
            # lastBomImport timestamp).
            V="${GITHUB_REF_NAME}"
          fi
          V=$(echo "$V" | tr '/' '_' | tr ' ' '_')
          echo "value=$V" >> "$GITHUB_OUTPUT"

      - name: Vault JWT auth → DT_UPLOAD_KEY
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: jwt-github
          role: dt-sbom-uploader
          jwtGithubAudience: https://vault.mgmt.techsecom.io
          exportEnv: true
          secrets: |
            secret/data/downstream/deptrack/upload-key api-key | DT_UPLOAD_KEY

      # -----------------------------------------------------------------------
      # 1. cdxgen — extract IaC provider/module dependencies as CycloneDX
      # -----------------------------------------------------------------------
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '20'

      - name: Install cdxgen
        run: |
          npm install -g @cyclonedx/cdxgen@latest
          cdxgen --version

      - name: cdxgen SBOM (IaC deps)
        env:
          FETCH_LICENSE: "true"
        run: |
          mkdir -p .sbom
          # cdxgen types include terraform + docker + kubernetes + helm
          cdxgen -r -o .sbom/bom-cdxgen.json --spec-version 1.5 "${{ inputs.scan-path }}"
          python3 -c "import json; d=json.load(open('.sbom/bom-cdxgen.json')); print(f'  cdxgen components: {len(d.get(\"components\", []))}')"

      # -----------------------------------------------------------------------
      # 2. Trivy config scan — Terraform/K8s/Docker misconfiguration detection
      #    Produces CycloneDX SBOM AND SARIF findings simultaneously
      # -----------------------------------------------------------------------
      - name: Trivy config scan → CycloneDX
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.scan-path }}
          format: cyclonedx
          output: .sbom/bom-trivy-config.json
          exit-code: '0'

      - name: Trivy config scan → SARIF (for Code Scanning tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.scan-path }}
          format: sarif
          output: trivy-config.sarif
          exit-code: '0'

      # SARIF upload requires GitHub Advanced Security on private repos.
      # `continue-on-error: true` on ALL SARIF steps so DT ingestion still
      # runs when a repo doesn't have GHAS enabled.
      - name: Upload Trivy SARIF to Code Scanning
        if: always() && hashFiles('trivy-config.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3.37.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      # -----------------------------------------------------------------------
      # 3. Checkov — deep IaC policy scanner (covers TF/CFN/K8s/Docker/Helm)
      # -----------------------------------------------------------------------
      - name: Checkov scan
        id: checkov
        continue-on-error: true
        uses: bridgecrewio/checkov-action@v12.1347.0
        with:
          directory: ${{ inputs.scan-path }}
          quiet: false
          soft_fail: true                    # never fail the step; gating below
          output_format: sarif,cli
          output_file_path: checkov-report,checkov-cli
          download_external_modules: true

      - name: Upload Checkov SARIF to Code Scanning
        if: always() && hashFiles('checkov-report/results_sarif.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3.37.3
        with:
          sarif_file: checkov-report/results_sarif.sarif
          category: checkov

      # -----------------------------------------------------------------------
      # 4. tfsec — Terraform-specific, complementary rule coverage
      # -----------------------------------------------------------------------
      - name: tfsec scan
        id: tfsec
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        continue-on-error: true
        with:
          working_directory: ${{ inputs.scan-path }}
          sarif_file: tfsec.sarif

      - name: Upload tfsec SARIF to Code Scanning
        if: always() && hashFiles('tfsec.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3.37.3
        with:
          sarif_file: tfsec.sarif
          category: tfsec

      # -----------------------------------------------------------------------
      # 5. Upload the cdxgen SBOM to DT (single authoritative upload)
      # -----------------------------------------------------------------------
      # cdxgen is the ONLY dependency SBOM for an IaC repo. The trivy-config
      # BOM is intentionally NOT uploaded to DT:
      #   * `trivy config` reports MISCONFIGURATIONS, not dependencies — its
      #     CycloneDX output carries ~0 components.
      #   * DT's POST /api/v1/bom is authoritative-REPLACE per project+version,
      #     so uploading the (empty) trivy-config BOM after cdxgen made DT
      #     DELETE every cdxgen component ("Deleting N components no longer part
      #     of the project"), and those deletions raced the in-flight vuln
      #     analysis -> COMPONENTS_VULNERABILITIES_FK1 rollbacks -> 0 vulns
      #     persisted (observed 2026-07-29).
      # trivy-config findings already reach the Code Scanning tab via the SARIF
      # step above — that is their correct destination, not DT.
      - name: Upload SBOM to Dependency-Track
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          PROJECT_VERSION: ${{ steps.ver.outputs.value }}
          PARENT_PROJECT: ${{ inputs.parent-project }}
        run: |
          upload() {
            local bom_file="$1"
            local tool="$2"
            [[ ! -s "$bom_file" ]] && { echo "  SKIP $tool"; return; }
            echo "── Uploading $tool ($(wc -c <"$bom_file") bytes) ──"
            args=(-sk -X POST -H "X-Api-Key: ${DT_UPLOAD_KEY}"
                  -F autoCreate=true
                  -F "projectName=${PROJECT_NAME}"
                  -F "projectVersion=${PROJECT_VERSION}"
                  -F "bom=@${bom_file}")
            [[ -n "$PARENT_PROJECT" ]] && args+=(-F "parentName=${PARENT_PROJECT}")
            resp=$(curl "${args[@]}" -w '\nHTTP:%{http_code}' "${DT_URL}/api/v1/bom")
            echo "$resp"
            echo "$resp" | grep -q "HTTP:2[0-9][0-9]" || { echo "!! $tool UPLOAD FAILED"; return 1; }
          }
          set -e
          upload .sbom/bom-cdxgen.json "cdxgen"

      # -----------------------------------------------------------------------
      # 6. Optional: fail on Critical CVE (from DT analysis)
      # -----------------------------------------------------------------------
      - name: Poll DT + fail on Critical
        if: ${{ inputs.fail-on-critical }}
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          PROJECT_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          for i in {1..30}; do
            sleep 10
            proj_uuid=$(curl -sk -H "X-Api-Key: ${DT_UPLOAD_KEY}" \
              "${DT_URL}/api/v1/project/lookup?name=${PROJECT_NAME}&version=${PROJECT_VERSION}" | \
              python3 -c "import sys,json; print(json.load(sys.stdin).get('uuid',''))")
            if [[ -n "$proj_uuid" ]]; then
              metrics=$(curl -sk -H "X-Api-Key: ${DT_UPLOAD_KEY}" \
                "${DT_URL}/api/v1/metrics/project/${proj_uuid}/current")
              if [[ -n "$metrics" && "$metrics" != "null" ]]; then
                critical=$(echo "$metrics" | python3 -c "import sys,json; print(json.load(sys.stdin).get('critical',0))")
                if [[ "$critical" -gt 0 ]]; then
                  echo "::error::DT: $critical CRITICAL vulns in ${PROJECT_NAME}@${PROJECT_VERSION}"
                  exit 1
                fi
                echo "DT scan clean (critical=0)"
                exit 0
              fi
            fi
            echo "  poll $i/30"
          done
          echo "::warning::DT analysis timeout"

      - name: Retain SBOMs as artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sboms-iac-${{ inputs.project-name }}-${{ steps.ver.outputs.value }}
          path: |
            .sbom/
            checkov-report/
            tfsec.sarif
            trivy-config.sarif
          retention-days: 7
          if-no-files-found: warn
